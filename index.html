        function changeLanguage(lang) {  
            document.documentElement.lang = lang;  
  
            document.querySelectorAll('.lang-btn').forEach(btn => {  
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);  
            });  
  
            document.querySelectorAll('[data-i18n]').forEach(el => {  
                const key = el.getAttribute('data-i18n');  
                if (translations[lang] && translations[lang][key]) {  
                    el.innerHTML = translations[lang][key];  
                }  
            });  
  
            if (translations[lang] && translations[lang].rsvpUrl) {  
                document.getElementById('rsvpLink').href = translations[lang].rsvpUrl;  
            }  
        }  
  
        /* FLIP CLOCK */  
        const WEDDING = new Date("2027-05-08T16:00:00").getTime();  
        const prev = {};  
        const timeouts = {};  
  
        function pad(n, len) {  
            return String(n).padStart(len, '0');  
        }  
  
        function flipUnit(id, newValue, padLen) {  
            const padded = pad(newValue, padLen);  
            if (prev[id] === padded) return;  
  
            const card      = document.getElementById('card-' + id);  
            const topStatic = card.querySelector('.card-top .num');  
            const botStatic = card.querySelector('.card-bottom .num');  
            const topFlip   = card.querySelector('.card-flip-top .num');  
            const botFlip   = card.querySelector('.card-flip-bottom .num');  
            const topFlap   = card.querySelector('.card-flip-top');  
            const botFlap   = card.querySelector('.card-flip-bottom');  
  
            const oldValue = prev[id] || padded;  
  
            topStatic.textContent = padded;  
            topFlip.textContent   = oldValue;  
            botFlip.textContent   = padded;  
  
            topFlap.style.visibility = 'visible';  
            botFlap.style.visibility = 'visible';  
            topFlap.style.animation  = 'none';  
            botFlap.style.animation  = 'none';  
            void topFlap.offsetWidth;  
  
            topFlap.style.animation = 'flipTopDown 0.3s ease-in forwards';  
            botFlap.style.animation = 'flipBottomUp 0.3s 0.3s ease-out forwards';  
  
            if (timeouts[id]) clearTimeout(timeouts[id]);  
            timeouts[id] = setTimeout(() => {  
                botStatic.textContent  = padded;  
                topFlap.style.visibility = 'hidden';  
                botFlap.style.visibility = 'hidden';  
                topFlap.style.animation  = 'none';  
                botFlap.style.animation  = 'none';  
            }, 700);  
  
            prev[id] = padded;  
        }  
  
        function tick() {  
            const now = Date.now();  
            const diff = WEDDING - now;  
  
            if (diff <= 0) {  
                document.getElementById('flipClock').innerHTML =  
                    '<h2 style="color:#f0e8ff;font-family:Aboreto,serif;font-size:clamp(22px,5vw,32px);">' +  
                    '🎉 ' +  
                    (document.documentElement.lang === 'it' ? 'È arrivato il grande giorno!' :  
                     document.documentElement.lang === 'en' ? 'The big day is here!' :  
                     "Le jour J est arrivé !") +  
                    ' 🎉</h2>';  
                clearInterval(timer);  
                return;  
            }  
  
            const d = Math.floor(diff / 86400000);  
            const h = Math.floor((diff % 86400000) / 3600000);  
            const m = Math.floor((diff % 3600000) / 60000);  
            const s = Math.floor((diff % 60000) / 1000);  
  
            flipUnit('days',    d, 3);  
            flipUnit('hours',   h, 2);  
            flipUnit('minutes', m, 2);  
            flipUnit('seconds', s, 2);  
        }  
  
        tick();  
        const timer = setInterval(tick, 1000);
